[project]
name = "openrelik-server"
version = "0.7.0"
description = "Digital Forensic Workflow System"
authors = [{name = "Johan Berggren", email = "jberggren@gmail.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115.11,<0.116.0",
    "uvicorn>=0.34.0,<0.35.0",
    "Authlib>=1.6.6,<2.0.0",
    "itsdangerous>=2.1.2,<3.0.0",
    "SQLAlchemy>=2.0.27,<3.0.0",
    "requests>=2.32.4,<3.0.0",
    "httpx>=0.27.0,<0.28.0",
    "python-jose[cryptography]>=3.4.0,<4.0.0",
    "python-multipart>=0.0.22,<0.1.0",
    "aiofiles>=23.2.1,<24.0.0",
    "celery[redis]>=5.3.6,<6.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "python-magic>=0.4.27,<0.5.0",
    "google-auth>=2.29.0,<3.0.0",
    "pyjwt[crypto]>=2.8.0,<3.0.0",
    "alembic>=1.13.2,<2.0.0",
    "argon2-cffi>=23.1.0,<24.0.0",
    "typer>=0.16.0,<0.17.0",
    "prometheus-client>=0.21.0,<0.22.0",
    "openrelik-ai-common>=0.6.0,<0.7.0",
    "openrelik-common>=0.7.9,<0.8.0",
    "sse-starlette>=2.3.6,<3.0.0",
    "duckdb>=1.3.2,<2.0.0",
    "pytz>=2026.1.post1,<2027.0",
    "markdown>=3.6.0,<4.0.0",
]

[dependency-groups]
dev = [
    "pylint>=3.1.0,<4.0.0",
    "pytest>=8.0.2,<9.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-celery>=1.1.3,<2.0.0",
    "pytest-asyncio>=0.25.2,<0.26.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "black>=26.3.1,<27.0.0",
    "ipython>=8.22.2,<9.0.0",
]

[tool.uv]
package = false

[tool.coverage.run]
branch = false
omit = ["src/tests/*", "src/datastores/sql/models/*"]
